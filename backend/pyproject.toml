[project]
name = "xiaosu-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3",
  "httpx>=0.27,<1", "tzdata>=2024.1", "sqlalchemy>=2,<3",
  "alembic>=1.13,<2", "filelock>=3.16,<4",
  "python-multipart>=0.0.18", "pypdf>=5,<7", "python-docx>=1,<2",
  "openai>=1.60,<3",
]

[project.optional-dependencies]
im = ["dingtalk-stream>=0.24,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
